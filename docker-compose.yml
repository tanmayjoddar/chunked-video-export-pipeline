services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-exports}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password_change_me}@postgres:5432/${POSTGRES_DB:-exports}?sslmode=disable
    volumes:
      - mediadata:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    user: "10001"
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password_change_me}@postgres:5432/${POSTGRES_DB:-exports}?sslmode=disable
    volumes:
      - mediadata:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 4.0
    # NOTE: pids_limit counts kernel tasks (threads included). Go runtime + River
    # + concurrent ffmpeg/x264 threads exceed 128 easily (-> "fatal error: newosproc"
    # and transient libx264 init failures). 1024 is the safe floor here.
    pids_limit: 1024
    user: "10001"
    restart: unless-stopped
    # no ports: worker has no inbound traffic

volumes:
  pgdata:
  mediadata:
